name: Android app (Vivid Music)

on:
  push:
    branches: [ccr-862b8099-9n782j, main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/VividMusic-1.0.${{ github.run_number }}.apk
          echo "name=VividMusic-1.0.${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-music-apk
          path: dist/*.apk
