name: Android app (Vivid Music)

on:
  push:
    branches: [ccr-862b8099-9n782j, main, master]
    paths-ignore: ['README.md', 'LICENSE', '**/*.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VividMusic-1.0.${{ github.run_number }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-music-apk
          path: dist/*.apk

      # An otherwise identical build numbered 1, so the emulator test can watch the in-app
      # updater find this run's predecessor on the release page and install it.
      - name: Build an old-numbered copy for the updater test
        env:
          VERSION_CODE: 1
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist-old
          cp app/build/outputs/apk/release/app-release.apk dist-old/VividMusic-old.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-music-old-apk
          path: dist-old/*.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vivid-music-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: vivid-music-old-apk
          path: dist-old

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make test music
        run: bash ci/make-test-audio.sh testmedia

      - name: Run app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash ci/smoke-test.sh "$(ls dist/*.apk | head -1)" testmedia screenshots "$(ls dist-old/*.apk | head -1)"

      - name: Pack screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cd screenshots && zip -q -r ../screenshots.zip . && cd .. && ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots.zip

      - name: Screenshot previews (base64, for reviewing from the log)
        if: always()
        run: bash ci/thumbnails.sh screenshots

  publish:
    needs: [build, emulator-test]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Needs "Read and write permissions" under Settings → Actions → General → Workflow permissions.
    # Without it the APK is still available as the vivid-music-apk artifact of each run.
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: vivid-music-latest
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vivid-music-apk
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: shots

      - name: Publish pre-release with the APK
        run: |
          cp dist/*.apk VividMusic.apk
          # Read by the app's updater: build number plus a checksum it verifies after download.
          jq -n --argjson code ${{ github.run_number }} --arg name "1.0.${{ github.run_number }}" \
            --arg sha "$(sha256sum VividMusic.apk | cut -d' ' -f1)" --argjson size "$(stat -c %s VividMusic.apk)" \
            --arg notes "${NOTES%%$'\n'*}" --arg commit "${GITHUB_SHA::7}" \
            '{versionCode: $code, versionName: $name, apk: "VividMusic.apk", sha256: $sha, size: $size, notes: $notes, commit: $commit}' > version.json
          cat version.json
          files="VividMusic.apk version.json"
          if [ -f shots/screenshots.zip ]; then cp shots/screenshots.zip screenshots.zip; files="$files screenshots.zip"; fi
          cat > notes.md <<NOTES
          **Vivid Music for Android – build ${{ github.run_number }}** (\`${GITHUB_SHA::7}\`, emulator test: ${{ needs.emulator-test.result }})

          ### Install on your phone
          1. On your phone, open this page and tap **VividMusic.apk** to download it.
          2. Open the downloaded file. If asked, allow your browser or file manager to *install unknown apps*.
          3. Tap **Install**, then open **Vivid Music** and allow access to music.

          On vivo phones: Settings → Battery → Background power consumption management → Vivid Music → **Allow**, so music keeps playing with the screen off.

          Already have Vivid Music? It checks this page when it opens and offers the update itself.

          \`screenshots.zip\` has previews from the automated emulator test.
          NOTES
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          sleep 3
          if ! gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Vivid Music for Android (build ${{ github.run_number }})" --notes-file notes.md; then
            echo "::warning::Couldn't publish the release. Enable Settings → Actions → General → Workflow permissions → Read and write. The APK is attached to this run as the vivid-music-apk artifact."
            exit 1
          fi
