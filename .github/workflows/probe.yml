name: Probe build environment
on:
  push:
    branches: [ccr-862b8099-9n782j]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Installed SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools || true
          java -version 2>&1
      - name: Latest library versions on Google Maven
        run: |
          for a in com/android/tools/build/gradle androidx/media3/media3-exoplayer androidx/compose/compose-bom androidx/core/core-ktx androidx/activity/activity-compose androidx/lifecycle/lifecycle-runtime-compose androidx/navigation/navigation-compose androidx/palette/palette-ktx androidx/documentfile/documentfile androidx/compose/material3/material3 androidx/compose/material/material-icons-extended androidx/datastore/datastore-preferences; do
            echo "== $a"
            curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|rc|dev' | tail -6 | tr '\n' ' '
            echo
          done
          for a in org/jetbrains/kotlin/kotlin-gradle-plugin io/coil-kt/coil-compose org/jetbrains/kotlinx/kotlinx-coroutines-android; do
            echo "== $a"
            curl -s https://repo.maven.apache.org/maven2/$a/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|RC|Beta|dev' | tail -6 | tr '\n' ' '
            echo
          done
